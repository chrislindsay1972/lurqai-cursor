<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-Tape Recorder</title>
  <script type="module" src="./self-tape-recorder.js"></script>
  <style>
    body {
      margin: 0;
      background: #f6f6f8;
      color: #1a1a1f;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 1120px; margin: 0 auto; padding: 28px 16px 48px; }
    h1 { margin: 0; font-size: 26px; }
    .lede { margin: 4px 0 20px; color: #5d5d68; }
    h2 { margin: 28px 0 8px; font-size: 16px; }
    #log { margin: 0; padding: 12px 16px 12px 36px; min-height: 48px; border: 1px solid #e3e3e8; border-radius: 12px; background: #fff; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    #log:empty::before { content: "Events from the recorder show up here."; margin-left: -20px; color: #8a8a94; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Audition: Hamlet</h1>
    <p class="lede">Spring Showcase · Role: Hamlet · Self-tape due Friday. Record a slate, then the soliloquy (3 minutes max).</p>

    <self-tape-recorder
      id="recorder"
      actor-name="Jane Doe"
      character="Hamlet"
      project="Spring Showcase"
      max-duration="180"
      upload-url="/upload">
    </self-tape-recorder>

    <h2>Recorder events</h2>
    <ol id="log"></ol>
  </main>

  <script type="module">
    const recorder = document.querySelector('#recorder');

    recorder.sides = `HAMLET
To be, or not to be, that is the question:
Whether 'tis nobler in the mind to suffer
The slings and arrows of outrageous fortune,
Or to take arms against a sea of troubles
And by opposing end them. To die—to sleep,
No more; and by a sleep to say we end
The heart-ache and the thousand natural shocks
That flesh is heir to: 'tis a consummation
Devoutly to be wish'd. To die, to sleep;
To sleep, perchance to dream—ay, there's the rub:
For in that sleep of death what dreams may come,
When we have shuffled off this mortal coil,
Must give us pause—there's the respect
That makes calamity of so long life.`;

    const log = document.querySelector('#log');
    const describe = (detail = {}) => {
      if (detail.take) {
        const { label, filename, durationSeconds, sizeBytes } = detail.take;
        return `${label} · ${filename} · ${durationSeconds}s · ${(sizeBytes / 1e6).toFixed(1)} MB`;
      }
      return JSON.stringify(detail);
    };
    for (const type of ['camera-ready', 'recording-start', 'take-recorded', 'take-submitted', 'take-deleted', 'recorder-error']) {
      recorder.addEventListener(type, (event) => {
        const line = document.createElement('li');
        line.textContent = `${new Date().toLocaleTimeString()}  ${type}  ${describe(event.detail)}`;
        log.prepend(line);
      });
    }
  </script>
</body>
</html>
